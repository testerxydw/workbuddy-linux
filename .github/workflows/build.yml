# ============================================================================
# WorkBuddy CN 多架构 deb 自动构建
#
# 触发：push tag(v*)、GitHub Release 发布、手动 workflow_dispatch
# 架构：x64 / arm64（GitHub 官方 runner，始终构建）
#       loong64（默认跳过；手动触发时勾选 enable_loong64，且需自托管 runner
#               标签 loong64 + 配置 ELECTRON_LOONG64_URL secret 才实际构建）
#
# 仓库 Secrets 配置（Settings → Secrets and variables → Actions）：
#   WIN_EXE_URL           必需。Windows 安装包下载地址，文件名须含版本号，形如
#                         https://.../WorkBuddy-win32-x64-user-5.5.1.37570276-xxxx.exe
#                         build.sh 会自动按文件名提取应用版本。
#   ELECTRON_LOONG64_URL  仅 loong64 需要。龙芯/UOS/Deepin 定制 Electron 的
#                         electron-v39.2.7-linux-loong64.zip 下载地址。
#
# 说明：job 级 if 不能使用 secrets / matrix 上下文，故 loong64 是否构建由
#       workflow_dispatch 的 input(enable_loong64) 控制（push/release 触发时默认为 false）。
# ============================================================================
name: build-deb

on:
  workflow_dispatch:
    inputs:
      enable_loong64:
        description: '同时构建 loong64（需自托管 runner 标签 loong64 + 配置 ELECTRON_LOONG64_URL secret）'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            debarch: amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            debarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js（编译 better-sqlite3 需要 npm）
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装系统依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y rsync p7zip-full dpkg-dev python3 curl

      - name: 获取 Windows 安装包
        run: |
          test -n "${{ secrets.WIN_EXE_URL }}" || { echo "缺少仓库 Secret: WIN_EXE_URL"; exit 1; }
          # 保留原始文件名（含版本号），build.sh 据此自动提取应用版本
          URL="${{ secrets.WIN_EXE_URL }}"
          FNAME="$(basename "${URL%%\?*}")"
          curl -fL "$URL" -o "$FNAME"

      - name: 构建 (${{ matrix.arch }})
        env:
          ELECTRON_LOONG64_URL: ${{ secrets.ELECTRON_LOONG64_URL }}
        run: bash build.sh --arch ${{ matrix.arch }} --no-install

      - name: 上传产物 (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: com.xydw.workbuddy_*_${{ matrix.debarch }}.deb
          if-no-files-found: error

      - name: 发布到 Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: com.xydw.workbuddy_*_${{ matrix.debarch }}.deb
          fail_on_unmatched_files: false

  build-loong64:
    name: build-loong64
    # job 级 if 只能用 inputs / github 等上下文，不能用 secrets / matrix
    if: ${{ inputs.enable_loong64 }}
    runs-on: [self-hosted, loong64]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js（编译 better-sqlite3 需要 npm）
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装系统依赖
        run: |
          sudo apt-get update -y || true
          sudo apt-get install -y rsync p7zip-full dpkg-dev python3 curl

      - name: 获取 Windows 安装包
        run: |
          test -n "${{ secrets.WIN_EXE_URL }}" || { echo "缺少仓库 Secret: WIN_EXE_URL"; exit 1; }
          URL="${{ secrets.WIN_EXE_URL }}"
          FNAME="$(basename "${URL%%\?*}")"
          curl -fL "$URL" -o "$FNAME"

      - name: 构建 (loong64)
        env:
          ELECTRON_LOONG64_URL: ${{ secrets.ELECTRON_LOONG64_URL }}
        run: bash build.sh --arch loong64 --no-install

      - name: 上传产物 (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: deb-loong64
          path: com.xydw.workbuddy_*_loong64.deb
          if-no-files-found: error

      - name: 发布到 Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: com.xydw.workbuddy_*_loong64.deb
          fail_on_unmatched_files: false

# ----------------------------------------------------------------------------
# loong64 的 QEMU 替代方案（无自托管机器时）：
#   将 build-loong64 的 runs-on 改为 ubuntu-24.04，并在「获取 Windows 安装包」前加：
#     - uses: docker/setup-qemu-action@v3
#     - uses: docker/setup-buildx-action@v3
#   然后以 loong64 容器执行构建，例如容器镜像 loongnix/debian-loong64，
#   但需自行保证镜像内含 rsync/7z/dpkg-dev/python3/curl/node，且能访问 ELECTRON_LOONG64_URL。
# ----------------------------------------------------------------------------
